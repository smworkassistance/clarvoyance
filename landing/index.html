<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clar — your growth is your currency</title>
<meta name="description" content="Clar is a free self-development companion. Your growth is your currency: free forever, and it lowers what you pay next. Two-minute daily practices, an AI friend, and a community that cheers for you.">
<meta name="theme-color" content="#0E4B3C">
<meta name="robots" content="noindex">
<meta property="og:title" content="Clar — your growth is your currency">
<meta property="og:description" content="A free companion for the person you are becoming. The more you grow, the less you pay.">
<meta property="og:type" content="website">
<link rel="icon" href="../clar-logo.jpg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Tokens (overwritten by a random palette from content.json on load — see pickPalette()) ── */
:root{
  --acc:#1FA06A; --acl:#5FD6A3; --acd:#137A52; --ink:#0E4B3C; --ink2:#0B3F52; --aur:#34D3A0; --paper:#F7F5EF; --gold:#D9B26D;
  --tx:#14231B; --mute:#5C6B63; --line:rgba(20,35,27,.10);
  --disp:'Cormorant Garamond',serif; --ui:'Inter Tight',-apple-system,'SF Pro Text',sans-serif;
  --r:20px; --sh:0 1px 2px rgba(11,31,23,.05),0 12px 40px rgba(11,31,23,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--ui);color:var(--tx);background:var(--paper);line-height:1.6;font-size:17px;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .6s ease}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 40px));margin:0 auto;position:relative}
.disp{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;line-height:1.05}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--acl)}
.light .eyebrow{color:var(--acd)}
section{position:relative;padding:clamp(64px,10vw,120px) 0}
.dark{background:linear-gradient(165deg,var(--ink) 0%,var(--ink2) 100%);color:#F0F8F4;overflow:hidden;overflow:clip;transition:background 1s ease}
.dark::before{content:"";position:absolute;inset:-20%;background:radial-gradient(600px 400px at 15% 20%,color-mix(in srgb,var(--aur) 22%,transparent),transparent 60%),radial-gradient(520px 380px at 85% 80%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 60%);animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
.dark>*{position:relative}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
.dark .mute{color:#BCD9CB}
.mute{color:var(--mute)}
h2.disp{font-size:clamp(2rem,5vw,3.4rem);margin:12px 0 14px}
.lead{font-size:clamp(1.05rem,2vw,1.25rem);max-width:640px}
.center{text-align:center}.center .lead{margin-inline:auto}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}

/* photo wash: a very low-opacity licensed photo behind a dark section, painted before the content so it never fights legibility */
.wash{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.16;filter:saturate(.55) brightness(.75);pointer-events:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 1rem var(--ui);padding:15px 26px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;min-height:50px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acd));color:#fff;box-shadow:0 8px 28px color-mix(in srgb,var(--acc) 38%,transparent)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 12px 34px color-mix(in srgb,var(--acc) 50%,transparent)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.light .btn.ghost{background:#fff;color:var(--tx);border-color:var(--line)}
.btn.gold{background:var(--gold);color:#2B1F08}
.btn.block{width:100%}

/* header */
header.top{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,box-shadow .3s}
header.top.solid{background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-weight:700;font-size:1.35rem}
.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.navlinks{display:flex;gap:26px}
.navlinks a{color:#CFE0D7;text-decoration:none;font-size:.95rem;font-weight:500}
.navlinks a:hover{color:#fff}
@media(max-width:820px){.navlinks{display:none}}
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acl),var(--gold));z-index:60}

/* hero */
.hero{background:radial-gradient(1100px 700px at 80% -10%,color-mix(in srgb,var(--aur) 50%,transparent),transparent 60%),radial-gradient(800px 560px at 0% 100%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 60%),linear-gradient(160deg,var(--acd) 0%,var(--ink) 55%,var(--ink2) 100%);color:#fff;padding-top:clamp(120px,16vw,170px);padding-bottom:clamp(70px,9vw,110px);overflow:hidden;transition:background 1s ease}
.hero .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media(max-width:900px){.hero .grid{grid-template-columns:1fr}}
.hero-lockup{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.hero-lockup img{width:58px;height:58px;border-radius:16px;object-fit:cover;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.hero-lockup span{font-family:var(--disp);font-weight:600;font-size:2.1rem;color:#fff}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.5rem);margin:14px 0 22px}
.hero .grid>div{min-width:0}
.hero h1 em{display:block;font-style:italic;background:linear-gradient(120deg,var(--gold),#F4DDA6 45%,var(--acl));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:#D5EADF}
.hero .clarify{margin-top:14px;max-width:560px;font-size:.92rem;color:#A9C7BA}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 20px}
.micro{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.88rem;color:#BCD9CB}
.micro span::before{content:"✓ ";color:var(--acl)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:float 14s ease-in-out infinite}
.orb.a{width:380px;height:380px;background:var(--aur);top:8%;right:-80px}
.orb.b{width:260px;height:260px;background:var(--gold);bottom:-60px;left:12%;opacity:.18;animation-delay:-6s}
@keyframes float{50%{transform:translateY(-32px) scale(1.06)}}

/* phone mockup */
.phone{position:relative;width:min(300px,78vw);margin:0 auto;aspect-ratio:9/18.5;border-radius:42px;background:#0E1B15;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 0 0 6px #07110C;padding:10px;transform:rotate(2.5deg)}
.phone .screen{height:100%;border-radius:32px;overflow:hidden;background:#F5F5F7;position:relative}
.phone .screen img{width:100%;height:100%;object-fit:cover;object-position:top}
.chip{position:absolute;background:rgba(255,255,255,.92);color:#10261B;font-weight:600;font-size:.82rem;padding:9px 14px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;animation:float 9s ease-in-out infinite}
.chip.c1{left:-26px;top:16%}.chip.c2{right:-22px;top:46%;animation-delay:-3s}.chip.c3{left:-14px;bottom:12%;animation-delay:-5s}
@media(max-width:520px){.chip.c1{left:10px;top:-16px}.chip.c2{right:-4px;top:62%}.chip.c3{left:0;bottom:6%}}
.mock-chat{padding:46px 14px 14px;display:flex;flex-direction:column;gap:9px;height:100%;background:linear-gradient(#F5F5F7,#EAF4EE);font-size:.8rem;line-height:1.35}
.mock-chat .b{max-width:82%;padding:9px 12px;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.mock-chat .u{align-self:flex-end;background:#fff;color:#1C1C1E}
.mock-chat .c{align-self:flex-start;background:var(--acc);color:#fff}
.mock-chat .hd{position:absolute;top:0;left:0;right:0;height:40px;background:rgba(255,255,255,.9);display:flex;align-items:center;padding:0 14px;font-weight:700;color:#1C1C1E;font-size:.82rem}
.mock-chat .tag{margin-top:auto;text-align:center;font-size:.68rem;color:#6E6E73}

/* pull */
.pull{padding:clamp(70px,11vw,130px) 0}
.pull .line{font-family:var(--disp);font-size:clamp(1.9rem,5.2vw,3.6rem);line-height:1.15;font-weight:500;color:#EAF3EE;margin:14px 0;opacity:.18;transition:opacity .8s,transform .8s;transform:translateY(14px)}
.pull .line.in{opacity:1;transform:none}
.pull .turn{margin-top:40px;font-size:clamp(1.15rem,2.4vw,1.5rem);color:var(--gold);max-width:620px;border-left:3px solid var(--gold);padding-left:18px}

/* free band */
.band{background:linear-gradient(90deg,var(--acd),var(--acc));color:#fff;padding:26px 0;transition:background 1s ease}
.band .wrap{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:center;justify-content:space-between}
.band h2{font-family:var(--disp);font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:600}
.band .st{display:flex;gap:30px;flex-wrap:wrap}
.band .st div{line-height:1.2}.band .st b{font-family:var(--disp);font-size:1.9rem;display:block}.band .st span{font-size:.85rem;opacity:.85}
/* contrast */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:38px}
@media(max-width:760px){.vs{grid-template-columns:1fr}}
.vs>div{border-radius:24px;padding:28px}
.vs .l{background:#EFEBE0;color:#4A5A52}
.vs .r{background:linear-gradient(160deg,#fff,#EAF4EE);border:2px solid var(--acc);box-shadow:0 20px 60px color-mix(in srgb,var(--acc) 18%,transparent)}
.vs h3{font-family:var(--disp);font-size:1.7rem;margin-bottom:14px;font-weight:600}
.vs ul{list-style:none;display:grid;gap:12px}
.vs li{display:flex;gap:10px}.vs .l li::before{content:"✕";color:#9A8A6B}.vs .r li::before{content:"✓";color:var(--acc);font-weight:800}
/* pillars (light, used inside About) */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:34px}
.pillar-light{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.pillar-light i{font-style:normal;font-size:1.6rem;color:var(--acc)}.pillar-light b{display:block;margin:8px 0 4px;font-size:1.05rem}.pillar-light span{color:var(--mute);font-size:.93rem}
/* toolkit extras */
.moment{display:flex;align-items:center;min-height:3.1em;margin:0 4px 12px;line-height:1.25;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--acd);background:color-mix(in srgb,var(--acc) 10%,transparent);border-radius:999px;padding:5px 12px}
.pm{padding:46px 12px 12px;height:100%;background:radial-gradient(120% 70% at 50% 0%,#2A1B5C,#0E0A24);color:#E8E3FF;display:flex;flex-direction:column;gap:10px;font-size:.74rem}
.pm .hd{position:absolute;top:0;left:0;right:0;height:38px;background:rgba(14,10,36,.9);display:flex;align-items:center;padding:0 14px;font-weight:700;color:#fff}
.pmc{background:rgba(255,255,255,.07);border:1px solid rgba(180,130,255,.25);border-radius:14px;padding:12px}.pmc .t{color:#C8A0FF;font-weight:700;margin-bottom:8px}
.pmc .bars{display:flex;align-items:flex-end;gap:7px;height:96px}.pmc .bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#C8A0FF,#F0C987)}
.pmc .d{display:flex;justify-content:space-between;margin-top:6px;color:#9A8FC9;font-size:.66rem}.pmc .big{font-size:1.3rem;font-weight:700;color:#F0C987}
.pmc .nn{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.pmc .nn b{display:block;height:100%;background:linear-gradient(90deg,#8DE6B0,#F0C987)}.pm .ex{margin-top:auto;text-align:center;color:#9A8FC9;font-size:.66rem}
/* intro (keynote) */
.intro{padding:clamp(80px,12vw,150px) 0}
.three{display:flex;flex-wrap:wrap;gap:6px 36px;justify-content:center;margin:26px 0 22px}
.three span{font-family:var(--disp);font-size:clamp(2.2rem,7.6vw,5.4rem);font-weight:600;line-height:1.05;background:linear-gradient(120deg,#fff,#CFE9DA);-webkit-background-clip:text;background-clip:text;color:transparent}
.three span:nth-child(2){background-image:linear-gradient(120deg,var(--gold),#F4DDA6)}
.three span:nth-child(3){background-image:linear-gradient(120deg,var(--acl),#E8F5EE)}
/* features: one-screen stage */
.stage{padding:clamp(76px,7vw,84px) 0 clamp(50px,5vw,70px)}
.stage .head{text-align:center;max-width:720px;margin:0 auto}
.stage h2.disp{margin:6px 0 10px;font-size:clamp(1.8rem,3.6vw,2.7rem)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:500}
.stg{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,80px);align-items:center;margin-top:clamp(20px,3vw,34px);min-height:min(600px,calc(100vh - 230px))}
.scene{position:relative;perspective:1500px;display:flex;justify-content:center;align-items:center;padding:20px 0}
.scene .halo{position:absolute;width:min(420px,90vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,color-mix(in srgb,var(--aur) 55%,transparent),color-mix(in srgb,var(--gold) 50%,transparent),color-mix(in srgb,var(--acl) 15%,transparent),color-mix(in srgb,var(--aur) 55%,transparent));filter:blur(46px);opacity:.75;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tilt{position:relative;transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.tilt .phone{width:min(330px,76vw,calc((100vh - 260px)*.5));transform:none;box-shadow:0 50px 100px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.1),inset 0 0 0 6px #07110C;animation:swing 7s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotateY(-10deg) rotateX(3deg)}50%{transform:rotateY(8deg) rotateX(-2deg)}}
.tilt .phone.spin{animation:none;transform:rotateY(-28deg) scale(.96);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tilt .screen.scr{position:absolute;inset:10px;height:auto;opacity:0;transform:scale(1.04);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.tilt .screen.scr.on{opacity:1;transform:none}
.tilt .screen.scr img{width:100%;height:100%;object-fit:cover;object-position:top}
.tilt .screen.scr .pm{padding-top:46px}
.fl{position:absolute;inset:0;pointer-events:none;transform:translateZ(60px)}
.fl span{position:absolute;background:rgba(255,255,255,.95);color:#0E3B2E;font-weight:600;font-size:.84rem;padding:9px 15px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.28);white-space:nowrap;opacity:0;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) forwards,bob 5s ease-in-out infinite}
.fl span:nth-child(1){left:-16%;top:12%;animation-delay:.1s,.7s}
.fl span:nth-child(2){right:-18%;top:44%;animation-delay:.35s,1.2s}
.fl span:nth-child(3){left:-12%;bottom:12%;animation-delay:.6s,1.7s;background:linear-gradient(135deg,#FFE9B5,#F4D58B)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.8)}to{opacity:1;transform:none}}
@keyframes bob{50%{translate:0 -9px}}
.info{min-width:0}
.info .grp{font-family:var(--disp);font-style:italic;font-size:1.25rem;color:var(--gold)}
.info .moment{align-self:flex-start;display:inline-flex;margin:10px 0 0;background:rgba(255,255,255,.12);color:#CFF5E3;min-height:0}
.info h3{font-size:clamp(2rem,4.2vw,3.3rem);margin:12px 0 12px}
.info p{font-size:1.1rem;max-width:520px}
.info .chips{margin-top:18px}
.info .chips span{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#EAF8F1}
.info .body{animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ctl{display:flex;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.arr{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:1.3rem;cursor:pointer;transition:background .2s,transform .2s;backdrop-filter:blur(8px)}
.arr:hover{background:rgba(255,255,255,.22);transform:scale(1.06)}
.dots{display:flex;gap:7px;flex-wrap:wrap;flex:1;min-width:140px}
.dots button{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.28);cursor:pointer;padding:0;transition:width .3s,background .3s;position:relative;overflow:hidden}
.dots button.on{width:34px;background:rgba(255,255,255,.3)}
.dots button.on i{position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:fill var(--dur,6.5s) linear forwards}
.stage.paused .dots button.on i{animation-play-state:paused}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cnt{font-size:.85rem;color:#BCD9CB;font-variant-numeric:tabular-nums}
@media(max-width:900px){
  .stg{grid-template-columns:1fr;min-height:0;gap:6px}
  .tilt .phone{width:min(230px,62vw)}
  .fl span{font-size:.74rem;padding:7px 11px}
  .fl span:nth-child(1){left:-2%;top:8%}.fl span:nth-child(2){right:-2%;top:48%}.fl span:nth-child(3){left:0;bottom:6%}
  .info{text-align:center}.info p{margin-inline:auto}.info .chips,.ctl{justify-content:center}.info .moment{align-self:center}
}
@media(prefers-reduced-motion:reduce){.tilt .phone,.halo,.fl span,.dark::before{animation:none!important}.fl span{opacity:1}}
/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* for you tabs */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 22px}
.tab{font:600 .95rem var(--ui);padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--tx);transition:all .2s}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(24px,4vw,44px);box-shadow:var(--sh);min-height:260px}
@media(max-width:820px){.panel{grid-template-columns:1fr}}
.panel h3{font-family:var(--disp);font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.1;margin-bottom:12px;font-weight:600}
.panel ul{list-style:none;display:grid;gap:12px;align-content:center}
.panel li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:14px 16px;font-weight:500}
.panel li::before{content:"✦";color:var(--acc)}
.foot{margin-top:26px;color:var(--mute);font-size:.95rem}

/* subjects marquee */
.subjects-sec{background:var(--ink);transition:background 1s ease}
.mq-row{overflow:hidden;margin:9px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-track{display:flex;gap:12px;width:max-content;animation:mq-scroll 46s linear infinite}
.mq-row.rtl .mq-track{animation-direction:reverse}
.mq-row:hover .mq-track{animation-play-state:paused}
@keyframes mq-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mq-track span{flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#EAF8F1;padding:10px 20px;border-radius:999px;font-size:.92rem;font-weight:500;white-space:nowrap}

/* areas foot */
.areas-foot{max-width:640px;margin:36px auto 0}

/* HI merged into about — no standalone styles needed */

/* how */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:40px;counter-reset:s}
.step{position:relative;padding:28px 24px 24px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.step .n{font-family:var(--disp);font-size:3.2rem;line-height:1;color:var(--acc);opacity:.9}
.step h3{margin:6px 0}

/* return / outcome */
.return-sec{background:var(--ink);transition:background 1s ease}
.return-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:40px}
.rcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:24px;backdrop-filter:blur(6px)}

.pp .off{display:inline-block;margin-top:4px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700}

/* plans */

.plan{position:relative;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px 26px;box-shadow:var(--sh);display:flex;flex-direction:column}

.plan .badge{position:absolute;top:-13px;left:26px;background:var(--acc);color:#fff;font-size:.76rem;font-weight:700;letter-spacing:.06em;padding:5px 14px;border-radius:999px;text-transform:uppercase}

.plan .pr{font-family:var(--disp);font-size:3.2rem;font-weight:600;line-height:1;margin:16px 0 4px}

/* about (merged: roots + HI + honest + faq) */
.honest-block{background:#EFEBE0;border-radius:28px;padding:clamp(24px,4vw,44px);margin-top:54px}

.honest-block li::before{content:"—  ";color:var(--acc);font-weight:800}
.faq{max-width:780px;margin:0 auto}
.faq details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 20px;margin-bottom:12px}

.faq summary::after{content:"+";color:var(--acc);font-size:1.4rem;line-height:1;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}

/* final */
.final{background:radial-gradient(1000px 600px at 50% 120%,color-mix(in srgb,var(--gold) 28%,transparent),transparent 60%),radial-gradient(900px 600px at 20% 0%,color-mix(in srgb,var(--acc) 40%,transparent),transparent 60%),var(--ink);text-align:center;color:#fff;transition:background 1s ease}
.final h2{font-size:clamp(2.3rem,6.4vw,4.6rem)}
.final .kicker-line{font-family:var(--disp);font-style:italic;font-size:clamp(1.1rem,2.2vw,1.4rem);color:var(--gold);margin-bottom:10px}

footer{background:#07130E;color:#8CA396;padding:34px 0 90px;font-size:.88rem}

.bot-panel.open{display:flex}
@media(max-width:820px){.bot-panel{right:14px;left:14px;width:auto;bottom:calc(152px + env(safe-area-inset-bottom));max-height:min(540px,calc(100vh - 210px))}}
.bot-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.bot-logo{width:38px;height:38px;border-radius:11px;object-fit:cover;flex-shrink:0}
.bot-title{font-family:var(--disp);font-weight:600;font-size:1.18rem;color:var(--tx);line-height:1.1}
.bot-sub{font-size:.76rem;color:var(--mute)}
.bot-close{margin-left:auto;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--mute);line-height:1}
.bot-msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:.92rem;background:#FBFAF6}
.bot-msgs .bm{max-width:84%;padding:10px 14px;border-radius:16px;line-height:1.42}
.bot-msgs .bm.u{align-self:flex-end;background:var(--acc);color:#fff}
.bot-msgs .bm.c{align-self:flex-start;background:#fff;border:1px solid var(--line);color:var(--tx)}
.bot-msgs .bm.sys{align-self:center;font-size:.78rem;color:var(--mute);text-align:center;max-width:100%}
.bot-typing{align-self:flex-start;display:flex;gap:4px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:16px}
.bot-typing span{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:botblink 1.2s infinite}
.bot-typing span:nth-child(2){animation-delay:.2s}.bot-typing span:nth-child(3){animation-delay:.4s}
@keyframes botblink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.bot-premade{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 14px;background:#FBFAF6}

.bot-inputrow button{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:1.1rem;cursor:pointer;flex-shrink:0}

<body>
<div class="progress" id="progress"></div>
<div id="app"><div style="padding:120px 24px;text-align:center;color:#5C6B63">Loading…</div></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="sheet">
    <button class="x" id="mclose" aria-label="Close">×</button>
    <h3 id="mtitle">Join the list</h3>
    <p class="mute" id="mtext"></p>
    <input type="email" id="memail" placeholder="your@email.com" autocomplete="email" aria-label="Email">
    <button class="btn pri block" id="msend">Notify me</button>
    <div class="msg" id="mmsg" aria-live="polite"></div>
  </div>
</div>

<script>
/* ═══ Generic landing renderer: words from content.json, prices from ../pricing/plans.json ═══
   Payments: if plans.json billing.checkout_url is set, paid buttons go to `${checkout_url}?plan=<id>` (Razorpay or any
   gateway page/Worker). Until then they open the waitlist, which saves to the Supabase table plan_waitlist
   (db/schema_v260_plans.sql). "Ask Clar" calls the same Gemini worker the app itself uses (cold-frog-d555 /
   content.json backend.gemini_worker) directly from the browser — that worker already allows any origin and
   accepts a client-built system_instruction, so no Worker change was needed for the bot. Lead/feedback/
   scholarship tables: db/schema_v261_landing_pages.sql. Nothing here is tied to one gateway or one app. */
(function(){
var C=null,P=null;
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var inr=function(n){return '₹'+Math.round(n).toLocaleString('en-IN')};

Promise.all([fetch('content.json').then(function(r){return r.json()}),fetch('../pricing/plans.json').then(function(r){return r.json()})]).then(function(r){C=r[0];P=r[1];pickPalette();render();}).catch(function(e){
  $('#app').innerHTML='<div style="padding:120px 24px;text-align:center">This page needs to be opened through a web server.<br><small>'+esc(e)+'</small></div>';
});

/* rotating palette: a random hand-tuned theme on every load — accent, gold AND the dark-band tones all move
   together so the whole page always reads as one designed palette, never mismatched colours. Dark bands use a
   deep-but-alive tint of that palette's own hue (never near-black). Falls back to the brand defaults (= the
   first/Celadon palette) if content.json has none. */
function pickPalette(){
  var ps=(C&&C.palettes)||[];
  var p=ps.length?ps[Math.floor(Math.random()*ps.length)]:null;
  var b=C.brand,s=document.documentElement.style;
  if(p){
    s.setProperty('--acc',p.acc);s.setProperty('--acl',p.acl);s.setProperty('--acd',p.acd);
    s.setProperty('--paper',p.paper);s.setProperty('--gold',p.gold);
    s.setProperty('--ink',p.ink);s.setProperty('--ink2',p.ink2);s.setProperty('--aur',p.aur);
  }else{
    s.setProperty('--acc',b.accent);s.setProperty('--acl',b.accent_light);s.setProperty('--acd',b.accent_dark);
    s.setProperty('--ink',b.ink_dark);s.setProperty('--paper',b.paper);s.setProperty('--gold',b.gold);
  }
}

/* attribution: every "Start free" link carries ref=landing (+ which audience tab, if any) so the app can learn what converts */
function appUrl(f){var u=C.brand.app_url;return u+(u.indexOf('?')>-1?'&':'?')+'ref=landing'+(f?'&for='+encodeURIComponent(f):'');}
/* illustrative progress card (HTML, not a screenshot) in the same dark style as the app's Fortune tab (deliberately
   keeps its own fixed cosmic purple/gold — that is the real app's own colour language on that screen, not part of
   the landing page's rotating palette) */
function progressInner(){var bars=[34,52,41,68,60,82,74];
  return '<div class="pm"><div class="hd">Your progress</div><div class="pmc"><div class="t">Daily performance</div><div class="bars">'
   +bars.map(function(v,i){return '<i style="height:'+v+'%"></i>'}).join('')+'</div><div class="d"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div></div>'
   +'<div class="pmc"><div class="t">Streak</div><div class="big">7 days 🔥</div></div><div class="pmc"><div class="t">Non-Negotiables</div><div class="nn"><b style="width:86%"></b></div></div><div class="ex">Example data</div></div>';}
/* the contents of one phone screen: a real screenshot, or the HTML example above */
function featScreen(it){
  if(it.mock==='progress')return progressInner();
  return '<img loading="lazy" src="'+esc(it.img)+'" alt="'+esc(it.alt||it.title)+'" onerror="this.parentNode.innerHTML=\'<div class=ph>'+esc(it.title)+'</div>\'">';
}
/* subjects marquee: ~120 life areas split into 3 rows, each doubled so a -50% translateX loops seamlessly;
   alternating scroll direction per row for visual interest; pauses on hover/touch, frozen entirely by the
   page's blanket prefers-reduced-motion rule */
function subjectsRowsHtml(subjects){
  var rows=[[],[],[]];
  subjects.forEach(function(s,i){rows[i%3].push(s)});
  return rows.map(function(row,ri){
    var doubled=row.concat(row);
    return '<div class="mq-row'+(ri%2?' rtl':'')+'"><div class="mq-track">'+doubled.map(function(s){return '<span>'+esc(s)+'</span>'}).join('')+'</div></div>';
  }).join('');
}
function render(){
  var b=C.brand,h=C.hero;
  var titleHtml=h.title_lines.map(function(l){return l===h.title_emphasis?'<em>'+esc(l)+'</em>':esc(l)}).join('<br>');
  var plans=P.plans,xp=P.xp_discount;
  var html='';
  html+='<header class="top" id="top"><div class="wrap nav"><a class="brand" href="#"><img src="'+esc(b.logo)+'" alt="" onerror="this.style.display=\'none\'">'+esc(b.name)+'</a><nav class="navlinks" aria-label="Sections">'+C.nav.links.map(function(l){return '<a href="'+esc(l[1])+'">'+esc(l[0])+'</a>'}).join('')+'</nav><a class="btn pri" style="padding:10px 20px;min-height:42px" href="'+esc(appUrl())+'">'+esc(C.nav.cta)+'</a></div></header>';

  /* hero — big logo+wordmark lockup, the locked spine headline, the honest growth-score clarifier, phone demo */
  html+='<section class="hero"><div class="orb a"></div><div class="orb b"></div><div class="wrap grid"><div>'
    +'<div class="hero-lockup"><img src="'+esc(b.logo)+'" alt="" onerror="this.style.display=\'none\'"><span>'+esc(b.name)+'</span></div>'
    +'<div class="eyebrow">'+esc(h.eyebrow)+'</div><h1 class="disp">'+titleHtml+'</h1><p class="lead">'+esc(h.sub)+'</p><p class="clarify">'+esc(h.clarify)+'</p>'
    +'<div class="cta-row"><a class="btn pri" href="'+esc(appUrl())+'">'+esc(h.cta_primary)+' →</a><a class="btn ghost" href="#how">'+esc(h.cta_secondary)+'</a></div>'
    +'<div class="micro">'+h.micro.map(function(m){return '<span>'+esc(m)+'</span>'}).join('')+'</div></div>'
    +'<div style="position:relative"><div class="phone"><div class="screen"><div class="mock-chat"><div class="hd">✦ Clar</div>'
    +'<div class="b c">Hey Asha. How are you feeling today?</div><div class="b u">Heavy week. I keep putting things off.</div>'
    +'<div class="b c">That sounds draining. What part keeps getting pushed back the most?</div><div class="b u">My own project.</div>'
    +'<div class="b c">Then let us start there. Just two minutes.</div><div class="tag">Example conversation</div></div></div></div>'
    +'<div class="chip c1">🔥 7-day streak</div><div class="chip c2">+8 XP earned</div><div class="chip c3">✦ One small step</div></div></div></section>';

  /* free band */
  var fb=C.freeband;
  html+='<div class="band"><div class="wrap"><h2>'+esc(fb.title)+'</h2><div class="st">'+fb.items.map(function(i){return '<div><b>'+esc(i.big)+'</b><span>'+esc(i.small)+'</span></div>'}).join('')+'</div></div></div>';

  /* keynote intro: one idea, three words (rule of three) */
  var it=C.intro;
  html+='<section class="dark intro" id="why"><div class="wrap center"><div class="eyebrow">'+esc(it.kicker)+'</div><h2 class="disp">'+esc(it.title)+'</h2>'
    +'<div class="three">'+it.words.map(function(w,i){return '<span class="rv" style="transition-delay:'+(i*160)+'ms">'+esc(w)+'</span>'}).join('')+'</div><p class="lead mute">'+esc(it.sub)+'</p></div></section>';

  /* features: one-screen stage — moved up right after the intro, per the owner's "slider near the top" ask.
     Phone on the left, the feature on the right, floating chips; auto-advances, swipe, arrows or keys */
  var fe=C.features;
  html+='<section class="dark stage" id="inside"><div class="wrap"><div class="head"><div class="eyebrow">What is inside</div><h2 class="disp">'+esc(fe.title)+'</h2><p class="lead mute">'+esc(fe.sub)+'</p></div>'
    +'<div class="stg" id="stg"><div class="scene" id="scene"><div class="halo"></div><div class="tilt" id="tilt"><div class="phone" id="sphone">'
    +fe.items.map(function(x,i){return '<div class="screen scr'+(i===0?' on':'')+'" data-i="'+i+'">'+featScreen(x)+'</div>'}).join('')

function compare(){
  var keys=[];P.plans.forEach(function(p){Object.keys(p.limits).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k)})});
  var nice={clar_chat_per_day:'Clar AI messages / day',fortune_progress_charts:'Progress charts',goal_images:'Goal vision images',universal_guides:'Universal guides',private_guides:'Guides made for you',private_guide_posts_per_week:'Posts / week per own guide',ai_fortune_reading:'AI Fortune report card',ai_pulse_reflection:'Weekly AI reflection'};
  var val=function(v){return v===null?'Unlimited':v===true?'✓':v===false?'—':v===0?'—':v};
  return '<details class="compare"><summary>Compare every limit ▾</summary><table><thead><tr><th></th>'+P.plans.map(function(p){return '<th>'+esc(p.name)+'</th>'}).join('')+'</tr></thead><tbody>'
    +keys.map(function(k){return '<tr><td>'+esc(nice[k]||k.replace(/_/g,' '))+'</td>'+P.plans.map(function(p){return '<td>'+esc(val(p.limits[k]))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></details>';
}

function wire(){
  /* header solid + progress + sticky */
  var top=$('#top'),st=$('#sticky'),pg=$('#progress');
  function onS(){var y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight;top.classList.toggle('solid',y>30);st.classList.toggle('show',y>innerHeight*.8);pg.style.width=(h>0?y/h*100:0)+'%';}
  addEventListener('scroll',onS,{passive:true});onS();
  /* reveal on scroll */
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.18});
  document.querySelectorAll('.rv,.pull .line').forEach(function(el,i){el.style.transitionDelay=(i%4)*70+'ms';io.observe(el);});
  /* stage: show one feature at a time; auto-advance until the visitor takes over; 3D tilt follows the pointer */
  (function(){
    var items=C.features.items,groups=C.features.groups,cur=0,timer=null,touched=false,visible=false,DUR=6500;
    var stage=document.getElementById('inside'),scrs=document.querySelectorAll('#sphone .scr'),dots=document.querySelectorAll('#sdots button'),ph=document.getElementById('sphone');
    if(!stage||!scrs.length)return;
    function show(i,spin){
      cur=(i+items.length)%items.length;var x=items[cur];
      scrs.forEach(function(s,k){s.classList.toggle('on',k===cur)});
      dots.forEach(function(d,k){d.classList.toggle('on',k===cur);d.style.setProperty('--dur',DUR+'ms');if(k===cur){var f=d.querySelector('i');f.style.animation='none';void f.offsetWidth;f.style.animation='';}});
      document.getElementById('info').innerHTML='<div class="body"><div class="grp">'+esc(groups[x.group]||'')+'</div><span class="moment">'+esc(x.moment)+'</span><h3 class="disp">'+esc(x.title)+'</h3><p class="mute">'+esc(x.text)+'</p><div class="chips">'+x.chips.map(function(c){return '<span>'+esc(c)+'</span>'}).join('')+'</div></div>';
      document.getElementById('fl').innerHTML=(x.floats||[]).map(function(t){return '<span>'+esc(t)+'</span>'}).join('');
      document.getElementById('scnt').textContent=(cur+1)+' / '+items.length;
      if(spin){ph.classList.add('spin');setTimeout(function(){ph.classList.remove('spin')},500);}
    }
    function loop(){clearTimeout(timer);if(touched||!visible||document.hidden)return;timer=setTimeout(function(){show(cur+1,true);loop();},DUR);}
    function user(i){touched=true;clearTimeout(timer);stage.classList.add('paused');show(i,true);}
    document.getElementById('sprev').onclick=function(){user(cur-1)};
    document.getElementById('snext').onclick=function(){user(cur+1)};
    dots.forEach(function(d){d.onclick=function(){user(+d.dataset.i)}});
    addEventListener('keydown',function(e){var r=stage.getBoundingClientRect();if(r.top>innerHeight*.7||r.bottom<innerHeight*.3)return;if(e.key==='ArrowRight')user(cur+1);if(e.key==='ArrowLeft')user(cur-1);});
    /* swipe */
    var sx=null;stage.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
    stage.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>45)user(cur+(dx<0?1:-1));});
    /* 3D tilt (desktop pointers only) */
    var tilt=document.getElementById('tilt'),scene=document.getElementById('scene');
    if(window.matchMedia('(hover:hover)').matches){
      scene.addEventListener('pointermove',function(e){var r=scene.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;tilt.style.transform='rotateY('+(px*22)+'deg) rotateX('+(-py*14)+'deg)';ph.style.animation='none';});
      scene.addEventListener('pointerleave',function(){tilt.style.transform='';ph.style.animation='';});
    }
    new IntersectionObserver(function(es){visible=es[0].isIntersecting;stage.classList.toggle('paused',!visible||touched);loop();},{threshold:.35}).observe(stage);
    document.addEventListener('visibilitychange',loop);
    show(0,false);
  })();
  /* wisdom quotes: auto-rotating slide, pauses on hover, dots clickable */
  (function(){
    var track=document.getElementById('wqtrack'),dots=document.querySelectorAll('#wqdots button');
    if(!track||!dots.length)return;
    var n=dots.length,cur=0,timer=null,touched=false;
    function show(i){cur=(i+n)%n;track.style.transform='translateX(-'+(cur*100)+'%)';dots.forEach(function(d,k){d.classList.toggle('on',k===cur)});}
    function loop(){clearTimeout(timer);if(touched)return;timer=setTimeout(function(){show(cur+1);loop();},5500);}
    dots.forEach(function(d){d.addEventListener('click',function(){touched=true;clearTimeout(timer);show(+d.dataset.i);});});
    var holder=track.closest('.wq-slider');
    holder.addEventListener('mouseenter',function(){clearTimeout(timer);});
    holder.addEventListener('mouseleave',function(){if(!touched)loop();});
    show(0);loop();
  })();
  /* for-you tabs */
  var fy=C.for_you.tabs;
  function showTab(i){var t=fy[i];document.querySelectorAll('.tab').forEach(function(b,k){b.setAttribute('aria-selected',k===i)});
    $('#panel').innerHTML='<div><div class="eyebrow" style="color:var(--acd)">'+esc(t.label)+'</div><h3>'+esc(t.headline)+'</h3><p class="mute">'+esc(t.text)+'</p><p style="margin-top:20px"><a class="btn pri" href="'+esc(appUrl(t.id))+'">Start free →</a></p></div><ul>'+t.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>';
    $('#panel').classList.add('in');}
  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){showTab(+b.dataset.i)})});showTab(0);
  /* growth-score calculator: discount = cap% x price x min(1, xp/target) */
  var xs=$('#xps'),xp=P.xp_discount;
  function calc(){var v=+xs.value,ratio=Math.min(1,v/xp.base_target);
    $('#xpn').textContent=v.toLocaleString('en-IN');$('#xpbar').style.width=(ratio*100)+'%';
    $('#pp').innerHTML=P.plans.filter(function(p){return p.price_monthly>0}).map(function(p){var off=p.price_monthly*(p.xp_discount_cap_pct/100)*ratio;
      return '<div class="pp"><div class="t">'+esc(p.name)+'</div><div class="p"><s>'+inr(p.price_monthly)+'</s>'+inr(p.price_monthly-off)+'</div>'+(off>=1?'<span class="off">You save '+inr(off)+'</span>':'<span class="off" style="background:none;color:#7F968A">Grow to save</span>')+'</div>';}).join('');}
  xs.addEventListener('input',calc);calc();
  /* waitlist / checkout */
  var modal=$('#modal'),plan=null;
  function openPaid(id){var cu=P.billing&&P.billing.checkout_url;if(cu){location.href=cu+(cu.indexOf('?')>-1?'&':'?')+'plan='+encodeURIComponent(id);return;}
    plan=P.plans.filter(function(p){return p.id===id})[0];$('#mtitle').textContent='Join the '+plan.name+' list';$('#mtext').textContent=C.plans_section.soon;$('#memail').value='';$('#mmsg').textContent='';modal.classList.add('open');setTimeout(function(){$('#memail').focus()},50);}
  document.querySelectorAll('[data-plan]').forEach(function(b){b.addEventListener('click',function(){openPaid(b.dataset.plan)})});
  $('#mclose').onclick=function(){modal.classList.remove('open')};modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('open')});
  addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('open')});
  $('#msend').onclick=function(){var em=$('#memail').value.trim(),m=$('#mmsg');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){m.textContent='Please enter a valid email.';return;}
    var be=C.backend;m.textContent='Saving…';
    if(!be||!be.supabase_url){m.textContent='Signup opens shortly. Follow '+C.brand.contact.instagram_handle+' for the day plans open.';return;}
    fetch(be.supabase_url+'/rest/v1/'+be.waitlist_table,{method:'POST',headers:{apikey:be.anon_key,Authorization:'Bearer '+be.anon_key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({email:em,plan_id:plan.id,product:P.product,source:'landing'})})
      .then(function(r){m.textContent=r.ok||r.status===409?C.plans_section.waitlist_done:'We could not save that right now. Please try again, or follow '+C.brand.contact.instagram_handle+'.';})
      .catch(function(){m.textContent='We could not save that right now. Please try again later.';});};
}

  var opened=false;

  function addBubble(role,text){var d=document.createElement('div');d.className='bm '+(role==='user'?'u':role==='sys'?'sys':'c');d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;}
  function addTyping(){var d=document.createElement('div');d.className='bot-typing';d.id='botTyping';d.innerHTML='<span></span><span></span><span></span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}
  function removeTyping(){var t=document.getElementById('botTyping');if(t)t.remove();}

  function openPanel(){opened=true;panel.classList.add('open');fab.classList.add('hide');
    if(!msgs.children.length)addBubble('c',bt.intro);
    if(ended)showEnded();
    setTimeout(function(){input.focus();},150);}
  function closePanel(){opened=false;panel.classList.remove('open');fab.classList.remove('hide');}
  fab.addEventListener('click',function(){opened?closePanel():openPanel();});
  document.getElementById('botClose').addEventListener('click',closePanel);

  function showEnded(){
    input.disabled=true;send.disabled=true;premade.style.display='none';
    if(!document.getElementById('botEndedMsg')){
      var d=addBubble('sys',bt.session_limit_msg);d.id='botEndedMsg';
      var a=document.createElement('a');a.className='btn pri bot-cont';a.href=appUrl('bot');a.textContent=bt.continue_cta+' →';
      msgs.appendChild(a);msgs.scrollTop=msgs.scrollHeight;
    }
  }

  function maybeShowLead(){
    if(leadShown||leadDone)return;
    var userTurns=history.filter(function(h){return h.role==='user'}).length;
    if(userTurns>=3){leadShown=true;leadBox.hidden=false;}
  }

  document.getElementById('botLeadSkip').addEventListener('click',function(){leadBox.hidden=true;leadDone=true;});
  document.getElementById('botLeadSave').addEventListener('click',function(){
    var nm=document.getElementById('botLeadName').value.trim(),em=document.getElementById('botLeadEmail').value.trim();
    if(!em||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){document.getElementById('botLeadEmail').focus();return;}
    leadDone=true;leadBox.hidden=true;
    if(be&&be.supabase_url&&be.leads_table){
      fetch(be.supabase_url+'/rest/v1/'+be.leads_table,{method:'POST',headers:{apikey:be.anon_key,Authorization:'Bearer '+be.anon_key,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({name:nm||null,email:em,context:history.slice(-8).map(function(h){return h.role+': '+h.text}).join('\n').slice(0,2000),source:'landing_bot'})}).catch(function(){});
    }
    addBubble('sys',bt.lead_done);
  });

  function send_(text){
    text=(text||'').trim();if(!text||ended)return;
    addBubble('user',text);history.push({role:'user',text:text});
    premade.style.display='none';input.value='';
    n++;try{sessionStorage.setItem(countKey,String(n));}catch(e){}
    addTyping();
    if(!be||!be.gemini_worker){removeTyping();addBubble('c',bt.error);return;}
    var contents=history.map(function(h){return {role:h.role==='user'?'user':'model',parts:[{text:h.text}]};});
    fetch(be.gemini_worker,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      _tier:'C',
      system_instruction:{parts:[{text:bt.system_prompt}]},
      contents:contents,
      generationConfig:{maxOutputTokens:260}
    })}).then(function(r){return r.json();}).then(function(data){
      removeTyping();
      var reply=data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text;
      if(data&&data.error||!reply){addBubble('c',bt.error);return;}
      reply=reply.trim();addBubble('c',reply);history.push({role:'model',text:reply});
      maybeShowLead();
      if(n>=MAX_USER_MSGS){ended=true;showEnded();}
    }).catch(function(){removeTyping();addBubble('c',bt.error);});
  }
  send.addEventListener('click',function(){send_(input.value);});
  input.addEventListener('keydown',function(e){if(e.key==='Enter')send_(input.value);});
  premade.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){send_(b.dataset.q);});});
}

function jsonld(){var s=document.createElement('script');s.type='application/ld+json';
  s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'SoftwareApplication',name:C.brand.name,applicationCategory:'LifestyleApplication',operatingSystem:'Web',description:C.hero.sub,
    offers:P.plans.map(function(p){return {'@type':'Offer',name:p.name,price:String(p.price_monthly),priceCurrency:P.currency}})});document.head.appendChild(s);}
})();
</script>
</body>
</html>
