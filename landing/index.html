<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clar — clarity for the becoming</title>
<meta name="description" content="Clar is a free self-development companion. Two-minute daily practices, a thoughtful AI friend and a community that cheers for you. Start free.">
<meta name="theme-color" content="#0B1F17">
<meta property="og:title" content="Clar — you were born with more than you remember">
<meta property="og:description" content="A free companion for the person you are becoming. Small daily practices, a friend who listens first, progress you can see.">
<meta property="og:type" content="website">
<link rel="icon" href="../clar-logo.jpg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens (filled from content.json brand block at load; defaults match the app's celadon theme) ── */
:root{
  --acc:#2E8B57; --acl:#72C293; --acd:#1A6640; --ink:#0B1F17; --paper:#F7F5EF; --gold:#D9B26D;
  --tx:#14231B; --mute:#5C6B63; --line:rgba(20,35,27,.10);
  --disp:'Cormorant Garamond',serif; --ui:'Inter Tight',-apple-system,'SF Pro Text',sans-serif;
  --r:20px; --sh:0 1px 2px rgba(11,31,23,.05),0 12px 40px rgba(11,31,23,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--ui);color:var(--tx);background:var(--paper);line-height:1.6;font-size:17px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}
.disp{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;line-height:1.05}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--acl)}
.light .eyebrow{color:var(--acd)}
section{position:relative;padding:clamp(64px,10vw,120px) 0}
.dark{background:var(--ink);color:#EAF3EE}
.dark .mute{color:#9DB3A8}
.mute{color:var(--mute)}
h2.disp{font-size:clamp(2rem,5vw,3.4rem);margin:12px 0 14px}
.lead{font-size:clamp(1.05rem,2vw,1.25rem);max-width:640px}
.center{text-align:center}.center .lead{margin-inline:auto}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 1rem var(--ui);padding:15px 26px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;min-height:50px}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acd));color:#fff;box-shadow:0 8px 28px rgba(46,139,87,.38)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(46,139,87,.5)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.light .btn.ghost{background:#fff;color:var(--tx);border-color:var(--line)}
.btn.gold{background:var(--gold);color:#2B1F08}
.btn.block{width:100%}

/* header */
header.top{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,box-shadow .3s}
header.top.solid{background:rgba(11,31,23,.78);backdrop-filter:blur(16px);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:700;font-size:1.15rem}
.brand img{width:34px;height:34px;border-radius:10px;object-fit:cover}
.navlinks{display:flex;gap:26px}
.navlinks a{color:#CFE0D7;text-decoration:none;font-size:.95rem;font-weight:500}
.navlinks a:hover{color:#fff}
@media(max-width:820px){.navlinks{display:none}}
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acl),var(--gold));z-index:60}

/* hero */
.hero{background:radial-gradient(1200px 700px at 78% -10%,rgba(46,139,87,.42),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(217,178,109,.14),transparent 60%),var(--ink);color:#fff;padding-top:clamp(120px,16vw,170px);padding-bottom:clamp(70px,9vw,110px);overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
@media(max-width:900px){.hero .grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.5rem);margin:18px 0 22px}
.hero .grid>div{min-width:0}
.hero h1 em{display:block;font-style:italic;background:linear-gradient(120deg,var(--gold),#F4DDA6 45%,var(--acl));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:#C4D6CC}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 20px}
.micro{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.88rem;color:#9DB3A8}
.micro span::before{content:"✓ ";color:var(--acl)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:float 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:var(--acc);top:8%;right:-80px}
.orb.b{width:260px;height:260px;background:var(--gold);bottom:-60px;left:12%;opacity:.18;animation-delay:-6s}
@keyframes float{50%{transform:translateY(-32px) scale(1.06)}}

/* phone mockup */
.phone{position:relative;width:min(300px,78vw);margin:0 auto;aspect-ratio:9/18.5;border-radius:42px;background:#0E1B15;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 0 0 6px #07110C;padding:10px;transform:rotate(2.5deg)}
.phone .screen{height:100%;border-radius:32px;overflow:hidden;background:#F5F5F7;position:relative}
.phone .screen img{width:100%;height:100%;object-fit:cover;object-position:top}
.chip{position:absolute;background:rgba(255,255,255,.92);color:#10261B;font-weight:600;font-size:.82rem;padding:9px 14px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;animation:float 9s ease-in-out infinite}
.chip.c1{left:-26px;top:16%}.chip.c2{right:-22px;top:46%;animation-delay:-3s}.chip.c3{left:-14px;bottom:12%;animation-delay:-5s}
@media(max-width:520px){.chip.c1{left:10px;top:-16px}.chip.c2{right:-4px;top:62%}.chip.c3{left:0;bottom:6%}}
.mock-chat{padding:46px 14px 14px;display:flex;flex-direction:column;gap:9px;height:100%;background:linear-gradient(#F5F5F7,#EAF4EE);font-size:.8rem;line-height:1.35}
.mock-chat .b{max-width:82%;padding:9px 12px;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.mock-chat .u{align-self:flex-end;background:#fff;color:#1C1C1E}
.mock-chat .c{align-self:flex-start;background:var(--acc);color:#fff}
.mock-chat .hd{position:absolute;top:0;left:0;right:0;height:40px;background:rgba(255,255,255,.9);display:flex;align-items:center;padding:0 14px;font-weight:700;color:#1C1C1E;font-size:.82rem}
.mock-chat .tag{margin-top:auto;text-align:center;font-size:.68rem;color:#6E6E73}

/* pull */
.pull{padding:clamp(70px,11vw,130px) 0}
.pull .line{font-family:var(--disp);font-size:clamp(1.9rem,5.2vw,3.6rem);line-height:1.15;font-weight:500;color:#EAF3EE;margin:14px 0;opacity:.18;transition:opacity .8s,transform .8s;transform:translateY(14px)}
.pull .line.in{opacity:1;transform:none}
.pull .turn{margin-top:40px;font-size:clamp(1.15rem,2.4vw,1.5rem);color:var(--gold);max-width:620px;border-left:3px solid var(--gold);padding-left:18px}

/* free band */
.band{background:linear-gradient(90deg,var(--acd),var(--acc));color:#fff;padding:26px 0}
.band .wrap{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:center;justify-content:space-between}
.band h2{font-family:var(--disp);font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:600}
.band .st{display:flex;gap:30px;flex-wrap:wrap}
.band .st div{line-height:1.2}.band .st b{font-family:var(--disp);font-size:1.9rem;display:block}.band .st span{font-size:.85rem;opacity:.85}
/* contrast */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:38px}
@media(max-width:760px){.vs{grid-template-columns:1fr}}
.vs>div{border-radius:24px;padding:28px}
.vs .l{background:#EFEBE0;color:#4A5A52}
.vs .r{background:linear-gradient(160deg,#fff,#EAF4EE);border:2px solid var(--acc);box-shadow:0 20px 60px rgba(46,139,87,.18)}
.vs h3{font-family:var(--disp);font-size:1.7rem;margin-bottom:14px;font-weight:600}
.vs ul{list-style:none;display:grid;gap:12px}
.vs li{display:flex;gap:10px}.vs .l li::before{content:"✕";color:#9A8A6B}.vs .r li::before{content:"✓";color:var(--acc);font-weight:800}
/* roots */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:34px}
.pillar{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:22px}
.pillar i{font-style:normal;font-size:1.6rem;color:var(--gold)}.pillar b{display:block;margin:8px 0 4px;font-size:1.05rem}.pillar span{color:#9DB3A8;font-size:.93rem}
/* toolkit extras */
.moment{display:flex;align-items:center;min-height:3.1em;margin:0 4px 12px;line-height:1.25;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--acd);background:rgba(46,139,87,.1);border-radius:999px;padding:5px 12px}
.shot h3{margin-top:4px!important}
.railwrap{position:relative}
.rbtn{position:absolute;top:42%;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;box-shadow:var(--sh);font-size:1.4rem;cursor:pointer;display:none;z-index:3}
.rbtn.l{left:-14px}.rbtn.r{right:-14px}
@media(min-width:900px){.rbtn{display:block}}
.gm{padding:44px 12px 12px;height:100%;background:linear-gradient(#F5F5F7,#EAF4EE);font-size:.74rem;line-height:1.4;color:#1C1C1E;display:flex;flex-direction:column;gap:9px}
.gm .hd{position:absolute;top:0;left:0;right:0;height:38px;background:rgba(255,255,255,.92);display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:.8rem}
.gm .post{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.gm .who{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}.gm .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--acl),var(--acc))}
.gm .why{color:var(--acd);font-weight:600;margin-top:6px}.gm .src{color:#6E6E73;margin-top:6px;font-size:.68rem}
.gm .pr{background:rgba(46,139,87,.1);border-radius:12px;padding:9px 10px;color:var(--acd);font-weight:600}
.pm{padding:46px 12px 12px;height:100%;background:radial-gradient(120% 70% at 50% 0%,#2A1B5C,#0E0A24);color:#E8E3FF;display:flex;flex-direction:column;gap:10px;font-size:.74rem}
.pm .hd{position:absolute;top:0;left:0;right:0;height:38px;background:rgba(14,10,36,.9);display:flex;align-items:center;padding:0 14px;font-weight:700;color:#fff}
.pmc{background:rgba(255,255,255,.07);border:1px solid rgba(180,130,255,.25);border-radius:14px;padding:12px}.pmc .t{color:#C8A0FF;font-weight:700;margin-bottom:8px}
.pmc .bars{display:flex;align-items:flex-end;gap:7px;height:96px}.pmc .bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(#C8A0FF,#F0C987)}
.pmc .d{display:flex;justify-content:space-between;margin-top:6px;color:#9A8FC9;font-size:.66rem}.pmc .big{font-size:1.3rem;font-weight:700;color:#F0C987}
.pmc .nn{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.pmc .nn b{display:block;height:100%;background:linear-gradient(90deg,#8DE6B0,#F0C987)}.pm .ex{margin-top:auto;text-align:center;color:#9A8FC9;font-size:.66rem}
/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--sh)}
.card .ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,rgba(46,139,87,.14),rgba(217,178,109,.2));display:grid;place-items:center;font-size:1.25rem;color:var(--acd);margin-bottom:14px}
.card h3{font-size:1.15rem;margin-bottom:6px}
.card p{color:var(--mute);font-size:.98rem}

/* for you tabs */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 22px}
.tab{font:600 .95rem var(--ui);padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--tx);transition:all .2s}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(24px,4vw,44px);box-shadow:var(--sh);min-height:260px}
@media(max-width:820px){.panel{grid-template-columns:1fr}}
.panel h3{font-family:var(--disp);font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.1;margin-bottom:12px;font-weight:600}
.panel ul{list-style:none;display:grid;gap:12px;align-content:center}
.panel li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:14px 16px;font-weight:500}
.panel li::before{content:"✦";color:var(--acc)}
.foot{margin-top:26px;color:var(--mute);font-size:.95rem}

/* areas */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:38px}
.area{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;transition:transform .25s,box-shadow .25s}
.area:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.area .ic{font-size:1.5rem;color:var(--acc);line-height:1}
.area b{display:block;font-size:1.05rem}
.area span{color:var(--mute);font-size:.95rem}

/* HI */
.hi{background:radial-gradient(900px 500px at 15% 0%,rgba(217,178,109,.14),transparent 60%),radial-gradient(900px 600px at 100% 100%,rgba(46,139,87,.28),transparent 60%),var(--ink)}
.hi .glass{margin-top:34px;padding:clamp(22px,4vw,40px);border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px)}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.tags span{padding:8px 16px;border-radius:999px;border:1px solid rgba(217,178,109,.5);color:var(--gold);font-size:.88rem;font-weight:600}

/* how */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:40px;counter-reset:s}
.step{position:relative;padding:28px 24px 24px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.step .n{font-family:var(--disp);font-size:3.2rem;line-height:1;color:var(--acc);opacity:.9}
.step h3{margin:6px 0}

/* inside */
.rail{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:34px 20px 24px;margin:0 -20px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.shot{flex:0 0 min(270px,74vw);scroll-snap-align:center}
.shot .phone{width:100%;transform:none;border-radius:34px;padding:8px}
.shot .screen{border-radius:26px}
.shot h3{margin:16px 4px 2px;font-size:1.1rem}
.shot .l{font-family:var(--disp);font-style:italic;font-size:1.25rem;color:var(--acd);margin:0 4px 4px}
.shot p{color:var(--mute);font-size:.93rem;margin:0 4px}
.ph{display:grid;place-items:center;height:100%;background:linear-gradient(160deg,#EAF4EE,#DDEBE3);color:var(--acd);font-weight:700;text-align:center;padding:20px}
.more{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.more span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.92rem}

/* earn */
.earn{background:radial-gradient(900px 600px at 80% 0%,rgba(46,139,87,.3),transparent 60%),var(--ink)}
.calc{margin-top:34px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px}
@media(max-width:820px){.calc{grid-template-columns:1fr}}
.calc .box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:clamp(22px,3.5vw,34px);backdrop-filter:blur(14px)}
.xpnum{font-family:var(--disp);font-size:clamp(3rem,9vw,5.2rem);line-height:1;color:#fff;font-weight:600}
.xpnum small{font-size:1rem;font-family:var(--ui);color:#9DB3A8;margin-left:8px;font-weight:500}
.bar{height:14px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:18px 0 8px}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--acl),var(--gold));transition:width .5s cubic-bezier(.2,.8,.2,1)}
input[type=range]{width:100%;accent-color:var(--gold);height:34px}
.price-pair{display:grid;gap:14px}
.pp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:18px 20px}
.pp .t{font-size:.85rem;color:#9DB3A8;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.pp .p{font-family:var(--disp);font-size:2.6rem;font-weight:600;color:#fff;line-height:1.1}
.pp .p s{font-size:1.2rem;color:#7F968A;margin-right:8px;font-family:var(--ui)}
.pp .off{display:inline-block;margin-top:4px;background:rgba(217,178,109,.18);color:var(--gold);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700}
.note{font-size:.88rem;color:#9DB3A8;margin-top:12px}

/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin-top:44px;align-items:stretch}
.plan{position:relative;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px 26px;box-shadow:var(--sh);display:flex;flex-direction:column}
.plan.hot{border:2px solid var(--acc);transform:translateY(-8px);box-shadow:0 24px 70px rgba(46,139,87,.25)}
@media(max-width:820px){.plan.hot{transform:none}}
.plan .badge{position:absolute;top:-13px;left:26px;background:var(--acc);color:#fff;font-size:.76rem;font-weight:700;letter-spacing:.06em;padding:5px 14px;border-radius:999px;text-transform:uppercase}
.plan h3{font-family:var(--disp);font-size:2rem;font-weight:600}
.plan .tl{color:var(--mute);font-size:.95rem;min-height:2.6em}
.plan .pr{font-family:var(--disp);font-size:3.2rem;font-weight:600;line-height:1;margin:16px 0 4px}
.plan .pr small{font-family:var(--ui);font-size:1rem;color:var(--mute);font-weight:500}
.plan .xpn{font-size:.86rem;color:var(--acd);font-weight:600;margin-bottom:16px;min-height:1.3em}
.plan ul{list-style:none;display:grid;gap:10px;margin:8px 0 26px;flex:1}
.plan li{display:flex;gap:10px;font-size:.96rem}
.plan li::before{content:"✓";color:var(--acc);font-weight:800}
.soon{margin-top:18px;text-align:center;color:var(--mute);font-size:.95rem}
.compare{margin-top:30px}
.compare summary{cursor:pointer;font-weight:600;text-align:center;list-style:none}
.compare table{width:100%;border-collapse:collapse;margin-top:18px;background:#fff;border-radius:18px;overflow:hidden;font-size:.95rem}
.compare th,.compare td{padding:12px 14px;text-align:center;border-bottom:1px solid var(--line)}
.compare th:first-child,.compare td:first-child{text-align:left;font-weight:600}
.compare thead th{background:var(--ink);color:#fff}

/* honest */
.honest{background:#EFEBE0}
.honest ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:30px 0}
.honest li{background:#fff;border-radius:16px;padding:18px 20px;font-weight:500;border:1px solid var(--line)}
.honest li::before{content:"—  ";color:var(--acc);font-weight:800}

/* faq */
.faq{max-width:780px;margin:34px auto 0}
.faq details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 20px;margin-bottom:12px}
.faq summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:14px}
.faq summary::after{content:"+";color:var(--acc);font-size:1.4rem;line-height:1;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{padding:0 0 18px;color:var(--mute)}

/* final */

.final h2{font-size:clamp(2.3rem,6.4vw,4.6rem)}
.final blockquote{font-family:var(--disp);font-style:italic;font-size:1.4rem;color:var(--gold);margin:44px auto 0;max-width:560px}
footer{background:#07130E;color:#8CA396;padding:34px 0 90px;font-size:.88rem}
footer .row{display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between}
footer a{color:#B8CFC2}

/* sticky mobile cta + modal */
.sticky{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:55;display:none;transform:translateY(140%);transition:transform .35s}
.sticky.show{transform:none}
@media(max-width:820px){.sticky{display:block}}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(7,19,14,.66);backdrop-filter:blur(8px);padding:20px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:26px;padding:30px;max-width:440px;width:100%;box-shadow:0 30px 90px rgba(0,0,0,.4)}

.sheet input[type=email]{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);font:500 1rem var(--ui);margin:16px 0 12px}
.sheet .msg{font-size:.92rem;color:var(--mute);margin-top:12px;min-height:1.4em}
.sheet .x{float:right;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.pull .line{opacity:1;transform:none}}

<body>
<div class="progress" id="progress"></div>
<div id="app"><div style="padding:120px 24px;text-align:center;color:#5C6B63">Loading…</div></div>

    <button class="btn pri block" id="msend">Notify me</button>

  </div>
</div>

<script>
/* ═══ Generic landing renderer: words from content.json, prices from ../pricing/plans.json ═══
   Payments: if plans.json billing.checkout_url is set, paid buttons go to `${checkout_url}?plan=<id>` (Razorpay or any
   gateway page/Worker). Until then they open the waitlist, which saves to the Supabase table plan_waitlist
   (db/schema_v260_plans.sql). Nothing here is tied to one gateway or one app. */
(function(){
var C=null,P=null;
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var inr=function(n){return '₹'+Math.round(n).toLocaleString('en-IN')};

Promise.all([fetch('content.json').then(function(r){return r.json()}),fetch('../pricing/plans.json').then(function(r){return r.json()})]).then(function(r){C=r[0];P=r[1];render();}).catch(function(e){
  $('#app').innerHTML='<div style="padding:120px 24px;text-align:center">This page needs to be opened through a web server.<br><small>'+esc(e)+'</small></div>';
});

function setBrand(){var b=C.brand,s=document.documentElement.style;
  s.setProperty('--acc',b.accent);s.setProperty('--acl',b.accent_light);s.setProperty('--acd',b.accent_dark);s.setProperty('--ink',b.ink_dark);s.setProperty('--paper',b.paper);s.setProperty('--gold',b.gold);}

/* attribution: every "Start free" link carries ref=landing (+ which audience tab, if any) so the app can learn what converts */
function appUrl(f){var u=C.brand.app_url;return u+(u.indexOf('?')>-1?'&':'?')+'ref=landing'+(f?'&for='+encodeURIComponent(f):'');}
/* illustrative guide post (HTML, not a screenshot): shows the source line and the "why this for you" line the real feature has */
function guideMock(){return '<div class="phone"><div class="screen"><div class="gm"><div class="hd">Guides</div>'
  +'<div class="post"><div class="who"><span class="av"></span>Calm Focus</div>Before you start, name the one thing that matters most today. Then give it ten quiet minutes.<div class="why">Why this for you: you said you want to focus.</div><div class="pr">Try this · 1 minute</div><div class="src">Source: shown on every post</div></div>'
  +'<div class="post"><div class="who"><span class="av" style="filter:hue-rotate(60deg)"></span>Relationships</div>Listen to understand, not to reply. One real question can change a whole conversation.<div class="src">Example post</div></div></div></div></div>';}
/* illustrative progress card (HTML, not a screenshot) in the same dark style as the app's Fortune tab */
function progressMock(){var bars=[34,52,41,68,60,82,74];
  return '<div class="phone"><div class="screen"><div class="pm"><div class="hd">Your progress</div><div class="pmc"><div class="t">Daily performance</div><div class="bars">'
   +bars.map(function(v,i){return '<i style="height:'+v+'%;animation-delay:'+(i*90)+'ms"></i>'}).join('')+'</div><div class="d"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div></div>'
   +'<div class="pmc"><div class="t">Streak</div><div class="big">7 days 🔥</div></div><div class="pmc"><div class="t">Non-Negotiables</div><div class="nn"><b style="width:86%"></b></div></div><div class="ex">Example data</div></div></div></div>';}
function phoneImg(src,alt,fallback){return '<div class="phone"><div class="screen"><img loading="lazy" src="'+esc(src)+'" alt="'+esc(alt)+'" onerror="this.parentNode.innerHTML=\'<div class=ph>'+esc(fallback||alt)+'</div>\'"></div></div>';}

function render(){
  setBrand();var b=C.brand,h=C.hero;
  var titleHtml=h.title_lines.map(function(l){return l===h.title_emphasis?'<em>'+esc(l)+'</em>':esc(l)}).join('<br>');
  var plans=P.plans,xp=P.xp_discount;
  var html='';
  html+='<header class="top" id="top"><div class="wrap nav"><a class="brand" href="#"><img src="'+esc(b.logo)+'" alt="" onerror="this.style.display=\'none\'">'+esc(b.name)+'</a><nav class="navlinks" aria-label="Sections">'+C.nav.links.map(function(l){return '<a href="'+esc(l[1])+'">'+esc(l[0])+'</a>'}).join('')+'</nav><a class="btn pri" style="padding:10px 20px;min-height:42px" href="'+esc(appUrl())+'">'+esc(C.nav.cta)+'</a></div></header>';

  /* hero */
  html+='<section class="hero"><div class="orb a"></div><div class="orb b"></div><div class="wrap grid"><div>'
    +'<div class="eyebrow">'+esc(h.eyebrow)+'</div><h1 class="disp">'+titleHtml+'</h1><p class="lead">'+esc(h.sub)+'</p>'
    +'<div class="cta-row"><a class="btn pri" href="'+esc(appUrl())+'">'+esc(h.cta_primary)+' →</a><a class="btn ghost" href="#how">'+esc(h.cta_secondary)+'</a></div>'
    +'<div class="micro">'+h.micro.map(function(m){return '<span>'+esc(m)+'</span>'}).join('')+'</div></div>'
    +'<div style="position:relative"><div class="phone"><div class="screen"><div class="mock-chat"><div class="hd">✦ Clar</div>'
    +'<div class="b c">Hey Asha. How are you feeling today?</div><div class="b u">Heavy week. I keep putting things off.</div>'
    +'<div class="b c">That sounds draining. What part keeps getting pushed back the most?</div><div class="b u">My own project.</div>'
    +'<div class="b c">Then let us start there. Just two minutes.</div><div class="tag">Example conversation</div></div></div></div>'
    +'<div class="chip c1">🔥 7-day streak</div><div class="chip c2">+8 XP earned</div><div class="chip c3">✦ One small step</div></div></div></section>';

  /* free band */
  var fb=C.freeband;
  html+='<div class="band"><div class="wrap"><h2>'+esc(fb.title)+'</h2><div class="st">'+fb.items.map(function(i){return '<div><b>'+esc(i.big)+'</b><span>'+esc(i.small)+'</span></div>'}).join('')+'</div></div></div>';

  /* pull */
  html+='<section class="dark pull"><div class="wrap">'+C.pull.lines.map(function(l){return '<div class="line">'+esc(l)+'</div>'}).join('')+'<div class="turn rv">'+esc(C.pull.turn)+'</div></div></section>';

  /* contrast: a feed vs a companion (design intent, no names) */
  var vs=C.contrast;
  html+='<section class="light"><div class="wrap"><div class="center"><div class="eyebrow">Spend it on purpose</div><h2 class="disp">'+esc(vs.title)+'</h2></div><div class="vs">'
    +'<div class="l rv"><h3>'+esc(vs.left.label)+'</h3><ul>'+vs.left.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul></div>'
    +'<div class="r rv"><h3>'+esc(vs.right.label)+'</h3><ul>'+vs.right.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul></div></div><p class="foot center">'+esc(vs.foot)+'</p></div></section>';

  /* shift */
  html+='<section class="light" style="padding-top:0"><div class="wrap"><div class="center"><div class="eyebrow">Why Clar</div><h2 class="disp">'+esc(C.shift.title)+'</h2><p class="lead mute">'+esc(C.shift.sub)+'</p></div><div class="cards">'
    +C.shift.cards.map(function(c){return '<div class="card rv"><div class="ic">'+esc(c.icon)+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.text)+'</p></div>'}).join('')+'</div></div></section>';

  /* for you */
  var fy=C.for_you;
  html+='<section class="light" style="background:#fff"><div class="wrap"><div class="eyebrow">Made for real life</div><h2 class="disp">'+esc(fy.title)+'</h2><p class="lead mute">'+esc(fy.sub)+'</p>'
    +'<div class="tabs" role="tablist">'+fy.tabs.map(function(t,i){return '<button class="tab" role="tab" id="tab-'+esc(t.id)+'" aria-selected="'+(i===0)+'" data-i="'+i+'">'+esc(t.label)+'</button>'}).join('')+'</div>'
    +'<div class="panel rv" id="panel" role="tabpanel"></div><p class="foot">'+esc(fy.foot)+'</p></div></section>';

  /* areas */
  var ar=C.areas;
  html+='<section class="light"><div class="wrap"><div class="center"><div class="eyebrow">Every walk of life</div><h2 class="disp">'+esc(ar.title)+'</h2><p class="lead mute">'+esc(ar.sub)+'</p></div><div class="areas">'
    +ar.items.map(function(a){return '<div class="area rv"><div class="ic">'+esc(a.icon)+'</div><div><b>'+esc(a.name)+'</b><span>'+esc(a.line)+'</span></div></div>'}).join('')+'</div><p class="foot center">'+esc(ar.foot)+'</p></div></section>';

  /* HI */
  var hi=C.hi;
  html+='<section class="dark hi"><div class="wrap"><div class="eyebrow">'+esc(hi.kicker)+'</div><h2 class="disp" style="max-width:860px">'+esc(hi.title)+'</h2><div class="glass rv"><p class="lead" style="color:#EAF3EE">'+esc(hi.text)+'</p><p class="mute" style="margin-top:16px;max-width:660px">'+esc(hi.quiet)+'</p><div class="tags">'+hi.tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div></div></div></section>';

  /* roots: what Clar is built on (honest authority, no named authors) */
  var ro=C.roots;
  html+='<section class="dark"><div class="wrap"><div class="eyebrow">'+esc(ro.kicker)+'</div><h2 class="disp" style="max-width:820px">'+esc(ro.title)+'</h2><p class="lead mute">'+esc(ro.text)+'</p><div class="pillars">'
    +ro.pillars.map(function(p){return '<div class="pillar rv"><i>'+esc(p.icon)+'</i><b>'+esc(p.t)+'</b><span>'+esc(p.d)+'</span></div>'}).join('')+'</div></div></section>';

  /* how */
  html+='<section class="light" id="how"><div class="wrap"><div class="center"><div class="eyebrow">How it works</div><h2 class="disp">'+esc(C.how.title)+'</h2></div><div class="steps">'
    +C.how.steps.map(function(s){return '<div class="step rv"><div class="n">'+esc(s.n)+'</div><h3>'+esc(s.title)+'</h3><p class="mute">'+esc(s.text)+'</p></div>'}).join('')+'</div></div></section>';

  /* inside */
  var ins=C.inside;
  html+='<section class="light" id="inside" style="background:#fff"><div class="wrap"><div class="center"><div class="eyebrow">Inside Clar</div><h2 class="disp">'+esc(ins.title)+'</h2><p class="lead mute">'+esc(ins.sub)+'</p></div></div><div class="wrap railwrap"><button class="rbtn l" id="rl" aria-label="Previous">‹</button><button class="rbtn r" id="rr" aria-label="Next">›</button><div class="rail" id="rail">'
    +ins.items.map(function(i){return '<div class="shot rv"><span class="moment">'+esc(i.moment||'')+'</span>'+(i.mock==='guide'?guideMock():i.mock==='progress'?progressMock():phoneImg(i.img,i.title+' screen',i.title))+'<h3>'+esc(i.title)+'</h3><div class="l">'+esc(i.line)+'</div><p>'+esc(i.text)+'</p></div>'}).join('')+'</div><div class="more">'+ins.more.map(function(m){return '<span>'+esc(m)+'</span>'}).join('')+'</div></div></section>';

  /* earn */
  var e=C.earn;
  html+='<section class="dark earn" id="earn"><div class="wrap"><div class="eyebrow">Earn your plan</div><h2 class="disp">'+esc(e.title)+'</h2><p class="lead mute">'+esc(e.sub)+'</p><div class="calc"><div class="box"><div class="mute" style="font-size:.9rem">'+esc(e.slider_label)+'</div>'
    +'<div class="xpnum"><span id="xpn">3,000</span><small>of <span id="xpt">'+xp.base_target.toLocaleString('en-IN')+'</span> XP target</small></div><div class="bar"><i id="xpbar"></i></div>'
    +'<input type="range" id="xps" min="0" max="'+xp.max_target+'" step="50" value="3000" aria-label="XP earned in a month"><p class="note">'+esc(e.note)+' '+esc(e.invite)+'</p></div>'
    +'<div class="price-pair" id="pp"></div></div></div></section>';

  /* plans */
  var ps=C.plans_section;
  html+='<section class="light" id="plans"><div class="wrap"><div class="center"><div class="eyebrow">Plans</div><h2 class="disp">'+esc(ps.title)+'</h2><p class="lead mute">'+esc(ps.sub)+'</p></div><div class="plans">'
    +plans.map(function(p){var paid=p.price_monthly>0;
      return '<div class="plan rv'+(p.badge==='Most popular'?' hot':'')+'">'+(p.badge?'<div class="badge">'+esc(p.badge)+'</div>':'')+'<h3>'+esc(p.name)+'</h3><div class="tl">'+esc(p.tagline)+'</div>'
       +'<div class="pr">'+(paid?inr(p.price_monthly)+'<small> / month</small>':'₹0<small> forever</small>')+'</div>'
       +'<div class="xpn">'+(p.xp_discount_cap_pct?'Up to '+p.xp_discount_cap_pct+'% off with your XP':'&nbsp;')+'</div>'
       +'<ul>'+p.features.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul>'
       +(paid?'<button class="btn '+(p.badge==='Most popular'?'pri':'ghost')+' block" style="'+(p.badge==='Most popular'?'':'background:var(--ink);color:#fff')+'" data-plan="'+esc(p.id)+'">'+esc(p.id==='pro'?ps.cta_paid_pro:ps.cta_paid)+'</button>':'<a class="btn ghost block" style="background:#fff;color:var(--tx);border:1px solid var(--line)" href="'+esc(appUrl())+'">'+esc(ps.cta_free)+' →</a>')+'</div>';}).join('')+'</div>'
    +'<p class="soon">'+esc(ps.soon)+'</p>'+compare()+(P.upcoming&&P.upcoming.length?'<p class="soon"><b>'+esc(ps.upcoming_label)+':</b> '+P.upcoming.map(esc).join(' · ')+'</p>':'')+'</div></section>';

  /* honest */
  var ho=C.honest;
  html+='<section class="honest light"><div class="wrap"><div class="eyebrow">Straight talk</div><h2 class="disp">'+esc(ho.title)+'</h2><ul>'+ho.items.map(function(i){return '<li class="rv">'+esc(i)+'</li>'}).join('')+'</ul><p class="lead">'+esc(ho.close)+'</p></div></section>';

  /* faq */
  html+='<section class="light" id="faq"><div class="wrap"><div class="center"><div class="eyebrow">Questions</div><h2 class="disp">Good to know.</h2></div><div class="faq">'+C.faq.map(function(q){return '<details><summary>'+esc(q.q)+'</summary><p>'+esc(q.a)+'</p></details>'}).join('')+'</div></div></section>';

  /* final */
  var f=C.final;
  html+='<section class="final"><div class="wrap"><h2 class="disp">'+esc(f.title)+'</h2><p class="lead" style="color:#C4D6CC">'+esc(f.sub)+'</p><div class="cta-row" style="justify-content:center"><a class="btn gold" href="'+esc(appUrl())+'">'+esc(f.cta)+' →</a></div><blockquote>“'+esc(f.quote)+'”</blockquote></div></section>';

  html+='<footer><div class="wrap"><div class="row"><div>© '+new Date().getFullYear()+' '+esc(b.name)+' · '+esc(b.domain)+'</div><div><a href="'+esc(b.contact.privacy)+'">Privacy</a> · <a href="'+esc(b.contact.instagram)+'" rel="noopener">'+esc(b.contact.instagram_handle)+'</a></div></div><p style="margin-top:14px;max-width:760px">'+esc(C.footer.note)+'</p></div></footer>';
  html+='<div class="sticky" id="sticky"><a class="btn pri block" href="'+esc(appUrl())+'">'+esc(C.hero.cta_primary)+' →</a></div>';

  $('#app').innerHTML=html;
  wire();jsonld();
}

function compare(){
  var keys=[];P.plans.forEach(function(p){Object.keys(p.limits).forEach(function(k){if(keys.indexOf(k)<0)keys.push(k)})});
  var nice={clar_chat_per_day:'Clar AI messages / day',fortune_progress_charts:'Progress charts',goal_images:'Goal vision images',universal_guides:'Universal guides',private_guides:'Guides made for you',private_guide_posts_per_week:'Posts / week per own guide',ai_fortune_reading:'AI Fortune report card',ai_pulse_reflection:'Weekly AI reflection'};
  var val=function(v){return v===null?'Unlimited':v===true?'✓':v===false?'—':v===0?'—':v};
  return '<details class="compare"><summary>Compare every limit ▾</summary><table><thead><tr><th></th>'+P.plans.map(function(p){return '<th>'+esc(p.name)+'</th>'}).join('')+'</tr></thead><tbody>'
    +keys.map(function(k){return '<tr><td>'+esc(nice[k]||k.replace(/_/g,' '))+'</td>'+P.plans.map(function(p){return '<td>'+esc(val(p.limits[k]))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></details>';
}

function wire(){
  /* header solid + progress + sticky */
  var top=$('#top'),st=$('#sticky'),pg=$('#progress');
  function onS(){var y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight;top.classList.toggle('solid',y>30);st.classList.toggle('show',y>innerHeight*.8);pg.style.width=(h>0?y/h*100:0)+'%';}
  addEventListener('scroll',onS,{passive:true});onS();
  /* reveal on scroll */
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.18});
  document.querySelectorAll('.rv,.pull .line').forEach(function(el,i){el.style.transitionDelay=(i%4)*70+'ms';io.observe(el);});
  var rail=$('#rail');if(rail){$('#rl').onclick=function(){rail.scrollBy({left:-300,behavior:'smooth'})};$('#rr').onclick=function(){rail.scrollBy({left:300,behavior:'smooth'})};}
  /* for-you tabs */
  var fy=C.for_you.tabs;
  function showTab(i){var t=fy[i];document.querySelectorAll('.tab').forEach(function(b,k){b.setAttribute('aria-selected',k===i)});
    $('#panel').innerHTML='<div><div class="eyebrow" style="color:var(--acd)">'+esc(t.label)+'</div><h3>'+esc(t.headline)+'</h3><p class="mute">'+esc(t.text)+'</p><p style="margin-top:20px"><a class="btn pri" href="'+esc(appUrl(t.id))+'">Start free →</a></p></div><ul>'+t.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>';
    $('#panel').classList.add('in');}
  document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){showTab(+b.dataset.i)})});showTab(0);
  /* XP calculator: discount = cap% x price x min(1, xp/target) */
  var xs=$('#xps'),xp=P.xp_discount;
  function calc(){var v=+xs.value,ratio=Math.min(1,v/xp.base_target);
    $('#xpn').textContent=v.toLocaleString('en-IN');$('#xpbar').style.width=(ratio*100)+'%';
    $('#pp').innerHTML=P.plans.filter(function(p){return p.price_monthly>0}).map(function(p){var off=p.price_monthly*(p.xp_discount_cap_pct/100)*ratio;
      return '<div class="pp"><div class="t">'+esc(p.name)+'</div><div class="p"><s>'+inr(p.price_monthly)+'</s>'+inr(p.price_monthly-off)+'</div>'+(off>=1?'<span class="off">You save '+inr(off)+'</span>':'<span class="off" style="background:none;color:#7F968A">Earn XP to save</span>')+'</div>';}).join('');}
  xs.addEventListener('input',calc);calc();
  /* waitlist / checkout */
  var modal=$('#modal'),plan=null;
  function openPaid(id){var cu=P.billing&&P.billing.checkout_url;if(cu){location.href=cu+(cu.indexOf('?')>-1?'&':'?')+'plan='+encodeURIComponent(id);return;}
    plan=P.plans.filter(function(p){return p.id===id})[0];$('#mtitle').textContent='Join the '+plan.name+' list';$('#mtext').textContent=C.plans_section.soon;$('#memail').value='';$('#mmsg').textContent='';modal.classList.add('open');setTimeout(function(){$('#memail').focus()},50);}
  document.querySelectorAll('[data-plan]').forEach(function(b){b.addEventListener('click',function(){openPaid(b.dataset.plan)})});
  $('#mclose').onclick=function(){modal.classList.remove('open')};modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('open')});
  addEventListener('keydown',function(e){if(e.key==='Escape')modal.classList.remove('open')});
  $('#msend').onclick=function(){var em=$('#memail').value.trim(),m=$('#mmsg');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){m.textContent='Please enter a valid email.';return;}
    var be=C.backend;m.textContent='Saving…';
    if(!be||!be.supabase_url){m.textContent='Signup opens shortly. Follow '+C.brand.contact.instagram_handle+' for the day plans open.';return;}
    fetch(be.supabase_url+'/rest/v1/'+be.waitlist_table,{method:'POST',headers:{apikey:be.anon_key,Authorization:'Bearer '+be.anon_key,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({email:em,plan_id:plan.id,product:P.product,source:'landing'})})
      .then(function(r){m.textContent=r.ok||r.status===409?C.plans_section.waitlist_done:'We could not save that right now. Please try again, or follow '+C.brand.contact.instagram_handle+'.';})
      .catch(function(){m.textContent='We could not save that right now. Please try again later.';});};
}

function jsonld(){var s=document.createElement('script');s.type='application/ld+json';
  s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'SoftwareApplication',name:C.brand.name,applicationCategory:'LifestyleApplication',operatingSystem:'Web',description:C.hero.sub,
    offers:P.plans.map(function(p){return {'@type':'Offer',name:p.name,price:String(p.price_monthly),priceCurrency:P.currency}})});document.head.appendChild(s);}
})();
</script>
</body>
