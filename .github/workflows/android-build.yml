name: Android Debug Build

# Builds a debug APK of the Capacitor Android app in the cloud — zero local disk
# cost, avoids repeating the Android Studio/SDK disk-space problem this project
# has hit before. Same pipeline is meant to become the real release build later
# (add a signing key as a secret, build assembleRelease/bundleRelease instead).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # v240 first attempt used 17 and failed: capacitor-cordova-android-plugins'
          # build.gradle sets sourceCompatibility/targetCompatibility to JavaVersion.VERSION_21 —
          # confirmed by reading that file after the real build failure, not guessed a second time.
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
