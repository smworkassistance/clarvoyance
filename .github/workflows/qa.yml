# Independent second gate (ADK): runs the same Playwright suite on Linux, where WebKit (iPhone engine) is stable.
# The local agent gate (ops/verify.js) covers Chromium/Android; this covers Chromium + WebKit on every push/PR.
name: QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install QA deps + browsers
        working-directory: qa
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run suite (live entry; the real AI chat call is skipped on CI to save quota)
        working-directory: qa
        env:
          CI: "true"
          QA_TARGET: index.html
          QA_SKIP_CHAT: "1"
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: qa/test-results
          retention-days: 7
